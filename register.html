<!DOCTYPE html>
<html>
<head>
  <title>StockGuru | Register</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #1c1c1c);
      background-size: 400% 400%;
      animation: gradient 12s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      color: white;
    }

    @keyframes gradient {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    .candles {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      z-index: 0;
      opacity: 0.15;
    }

    .candle {
      width: 12px;
      animation: move 6s infinite ease-in-out;
    }

    .green { background: #00ff99; }
    .red { background: #ff4d4d; }

    @keyframes move {
      0% { height: 50px; }
      50% { height: 150px; }
      100% { height: 80px; }
    }

    .card {
      position: relative;
      z-index: 2;
      backdrop-filter: blur(15px);
      background: rgba(255,255,255,0.1);
      padding: 40px;
      width: 380px;
      border-radius: 15px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: none;
      outline: none;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border-radius: 8px;
      border: none;
      background: #00c6ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #0072ff;
      transform: scale(1.05);
    }

    .links a {
      color: #00c6ff;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="candles">
  <div class="candle green" style="animation-delay:0s;"></div>
  <div class="candle red" style="animation-delay:1s;"></div>
  <div class="candle green" style="animation-delay:2s;"></div>
  <div class="candle red" style="animation-delay:3s;"></div>
  <div class="candle green" style="animation-delay:4s;"></div>
  <div class="candle red" style="animation-delay:5s;"></div>
</div>

<div class="card">
  <h2>📈 Create StockGuru Account</h2>

  <form id="register-form">
    <input type="text" id="reg-username" placeholder="Username" required />
    <input type="email" id="reg-email" placeholder="Email" required />
    <input type="password" id="reg-password" placeholder="Password" required />
    <button type="submit">Register</button>
  </form>

  <div class="links">
    <p>Already have account? <a href="login.html">Login</a></p>
  </div>
</div>

<script>
const form = document.getElementById("register-form");

form.addEventListener("submit", async function (e) {
  e.preventDefault();

  const username = document.getElementById("reg-username").value.trim();
  const email = document.getElementById("reg-email").value.trim();
  const password = document.getElementById("reg-password").value.trim();

  if (!username || !email || !password) {
    alert("All fields are required!");
    return;
  }

  try {
    const response = await fetch("http://localhost:5000/register", {
      method: "POST",
      headers: { 
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ username, email, password })
    });

    const data = await response.json();

    if (response.ok) {
      alert("✅ Registration successful!");
      form.reset();
      window.location.href = "login.html";
    } else {
      alert("❌ " + (data.message || "Registration failed"));
    }

  } catch (error) {
    console.error(error);
    alert("❌ Cannot connect to backend. Make sure server is running on port 5000.");
  }
});
</script>

</body>
</html>
